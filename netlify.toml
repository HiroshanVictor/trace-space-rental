[build]
  command = "node scripts/configure.mjs"
  publish = "."
[functions]
  directory = "netlify/functions"

[functions."expire-payment-holds"]
schedule = "*/15 * * * *"

[functions."process-reservation-email-outbox"]
schedule = "*/5 * * * *"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
